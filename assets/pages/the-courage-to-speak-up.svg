<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" role="img"><title>The Courage to Speak Up</title><desc>By Nicolas Castañeda. In April 2026, while I was studying at university, I experienced a motorcycle accident that resulted in a fractured foot and a two-month medical leave. This unexpected situation affected not only my physical health but also my academic progress. Although I immediately contacted the university and submitted all the required medical documents on time, getting the necessary academic support became a significant challenge. Some professors were understanding and supportive, while others did not respond to my messages. Despite having my medical excuses approved, the university initially suggested that I withdraw from the semester or risk failing it. However, I refused to accept this decision because I had followed all the required procedures. After escalating my case to the university’s senior administration and submitting a formal petition, I finally received the support I needed to complete my assignments and successfully finish the semester. This experience taught me the importance of perseverance, resilience, and standing up for my rights. Although the situation was physically and emotionally challenging, I learned that difficult circumstances should not prevent us from achieving our goals. Sometimes, overcoming obstacles requires not only patience but also the courage to speak up and demand fair treatment.</desc><rect width="1545" height="2000" fill="#fcfbf8"/><rect x="0" y="0" width="140" height="2000" fill="#0d1d33"/><rect x="68" y="480" width="3" height="950" fill="#ed6742"/><text x="34" y="67" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#fcfbf8" dominant-baseline="text-before-edge">A.C.E</text><text x="38" y="1855" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#ed6742" dominant-baseline="text-before-edge">07</text><text x="210" y="85" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">PERSONAL NARRATIVE</text><rect x="210" y="137" width="1230" height="2" fill="#ced5df"/><text x="200" y="195" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="700" fill="#101e34" dominant-baseline="text-before-edge">THE COURAGE</text><text x="200" y="310" font-family="Arial,Helvetica,sans-serif" font-size="104" font-weight="700" fill="#101e34" dominant-baseline="text-before-edge">TO SPEAK UP</text><rect x="210" y="455" width="175" height="7" fill="#ed6742"/><text x="210" y="493" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">By Nicolas Castañeda</text><text x="210" y="600" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">In April 2026, while I was studying at</text><text x="210" y="644" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">university, I experienced a motorcycle</text><text x="210" y="688" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">accident that resulted in a fractured foot</text><text x="210" y="732" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">and a two-month medical leave. This</text><text x="210" y="776" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">unexpected situation affected not only</text><text x="210" y="820" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">my physical health but also my academic</text><text x="210" y="864" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">progress. Although I immediately</text><text x="210" y="908" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">contacted the university and submitted</text><text x="210" y="952" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">all the required medical documents on</text><text x="210" y="996" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">time, getting the necessary academic</text><text x="210" y="1040" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">support became a significant challenge.</text><text x="210" y="1114" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Some professors were understanding</text><text x="210" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">and supportive, while others did not</text><text x="210" y="1202" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">respond to my messages. Despite</text><text x="210" y="1246" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">having my medical excuses approved,</text><text x="210" y="1290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">the university initially suggested that I</text><text x="210" y="1334" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">withdraw from the semester or risk failing</text><text x="210" y="1378" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">it.</text><text x="855" y="600" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">However, I refused to accept this</text><text x="855" y="644" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">decision because I had followed all the</text><text x="855" y="688" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">required procedures. After escalating my</text><text x="855" y="732" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">case to the university’s senior</text><text x="855" y="776" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">administration and submitting a formal</text><text x="855" y="820" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">petition, I finally received the support I</text><text x="855" y="864" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">needed to complete my assignments and</text><text x="855" y="908" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">successfully finish the semester.</text><text x="855" y="982" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">This experience taught me the</text><text x="855" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">importance of perseverance, resilience,</text><text x="855" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">and standing up for my rights. Although</text><text x="855" y="1114" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">the situation was physically and</text><text x="855" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">emotionally challenging, I learned that</text><text x="855" y="1202" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">difficult circumstances should not</text><text x="855" y="1246" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">prevent us from achieving our goals.</text><text x="855" y="1290" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Sometimes, overcoming obstacles</text><text x="855" y="1334" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">requires not only patience but also the</text><text x="855" y="1378" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">courage to speak up and demand fair</text><text x="855" y="1422" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">treatment.</text><rect x="210" y="1690" width="1225" height="2" fill="#ced5df"/><rect x="210" y="1740" width="5" height="130" fill="#365f9f"/><text x="245" y="1745" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">“The courage to speak up</text><text x="245" y="1802" font-family="Arial,Helvetica,sans-serif" font-size="43" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">and demand fair treatment.”</text><text x="210" y="1920" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0d1d33" dominant-baseline="text-before-edge">ACADEMIC COLLECTION OF ENDEAVORS</text><text x="1288" y="1920" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">A.C.E / 07</text></svg>