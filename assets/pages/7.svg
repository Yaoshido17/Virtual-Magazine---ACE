<svg xmlns="http://www.w3.org/2000/svg" width="1545" height="2000" viewBox="0 0 1545 2000" role="img"><title>Not Everything Is as It Seems</title><desc>By Jhon Gómez. One day during my first semester, I was on my way to university when something unexpected happened. That morning, I realised that things are not always what they seem. It was six in the morning, and I was waiting for the bus. The morning was peaceful, and I could hear people talking around me, just like on any other day. Then I noticed a young man standing next to me. He was wearing ordinary clothes, but his behaviour caught my attention: he kept moving strangely and looking around. Feeling uneasy, I looked around too. Everything else seemed normal. There was an elderly woman behind me and a few people wearing uniforms. Just to be safe, I moved my belongings into my front pockets and kept my hands in them. A few minutes later, my bus arrived. That was when the young man next to me deliberately fell to the ground, grabbed one of my arms, and began shaking it. At the same time, the elderly woman grabbed my other arm and tried to pull my hand out of my pocket while shouting, &quot;Help the young man!&quot; However, I suspected what was happening, so I did not rush to help. I kept my hands firmly in my pockets and tried to remain calm. Eventually, I managed to board the bus without any further trouble. Even though I appeared calm, my heart was pounding. That experience taught me that we cannot judge people&#x27;s intentions by their age, gender, or clothes. We never really know what someone is thinking. Whenever I remember that morning, I am reminded that not everything is as it seems.</desc><rect width="1545" height="2000" fill="#fcfbf8"/><rect x="0" y="0" width="140" height="2000" fill="#0d1d33"/><rect x="68" y="480" width="3" height="950" fill="#ed6742"/><text x="34" y="67" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="700" fill="#fcfbf8" dominant-baseline="text-before-edge">A.C.E</text><text x="38" y="1855" font-family="Arial,Helvetica,sans-serif" font-size="48" font-weight="700" fill="#ed6742" dominant-baseline="text-before-edge">07</text><text x="210" y="85" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">PERSONAL NARRATIVE</text><rect x="210" y="137" width="1230" height="2" fill="#ced5df"/><text x="200" y="195" font-family="Arial,Helvetica,sans-serif" font-size="99" font-weight="700" fill="#101e34" dominant-baseline="text-before-edge">NOT EVERYTHING</text><text x="200" y="310" font-family="Arial,Helvetica,sans-serif" font-size="99" font-weight="700" fill="#101e34" dominant-baseline="text-before-edge">IS AS IT SEEMS</text><rect x="210" y="455" width="175" height="7" fill="#ed6742"/><text x="210" y="493" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">By Jhon Gómez</text><text x="210" y="600" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">One day during my first semester, I was</text><text x="210" y="644" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">on my way to university when something</text><text x="210" y="688" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">unexpected happened. That morning, I</text><text x="210" y="732" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">realised that things are not always what</text><text x="210" y="776" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">they seem.</text><text x="210" y="850" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">It was six in the morning, and I was</text><text x="210" y="894" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">waiting for the bus. The morning was</text><text x="210" y="938" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">peaceful, and I could hear people talking</text><text x="210" y="982" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">around me, just like on any other day.</text><text x="210" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Then I noticed a young man standing</text><text x="210" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">next to me. He was wearing ordinary</text><text x="210" y="1114" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">clothes, but his behaviour caught my</text><text x="210" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">attention: he kept moving strangely and</text><text x="210" y="1202" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">looking around.</text><text x="210" y="1276" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Feeling uneasy, I looked around too.</text><text x="210" y="1320" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Everything else seemed normal. There</text><text x="210" y="1364" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">was an elderly woman behind me and a</text><text x="210" y="1408" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">few people wearing uniforms. Just to be</text><text x="210" y="1452" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">safe, I moved my belongings into my</text><text x="210" y="1496" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">front pockets and kept my hands in</text><text x="210" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">them.</text><text x="855" y="600" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">A few minutes later, my bus arrived. That</text><text x="855" y="644" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">was when the young man next to me</text><text x="855" y="688" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">deliberately fell to the ground, grabbed</text><text x="855" y="732" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">one of my arms, and began shaking it. At</text><text x="855" y="776" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">the same time, the elderly woman</text><text x="855" y="820" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">grabbed my other arm and tried to pull</text><text x="855" y="864" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">my hand out of my pocket while</text><text x="855" y="908" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">shouting, &quot;Help the young man!&quot;</text><text x="855" y="982" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">However, I suspected what was</text><text x="855" y="1026" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">happening, so I did not rush to help. I</text><text x="855" y="1070" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">kept my hands firmly in my pockets and</text><text x="855" y="1114" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">tried to remain calm. Eventually, I</text><text x="855" y="1158" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">managed to board the bus without any</text><text x="855" y="1202" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">further trouble. Even though I appeared</text><text x="855" y="1246" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">calm, my heart was pounding.</text><text x="855" y="1320" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">That experience taught me that we</text><text x="855" y="1364" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">cannot judge people&#x27;s intentions by their</text><text x="855" y="1408" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">age, gender, or clothes. We never really</text><text x="855" y="1452" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">know what someone is thinking.</text><text x="855" y="1496" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">Whenever I remember that morning, I am</text><text x="855" y="1540" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">reminded that not everything is as it</text><text x="855" y="1584" font-family="Arial,Helvetica,sans-serif" font-size="31" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">seems.</text><rect x="210" y="1700" width="1225" height="2" fill="#ced5df"/><rect x="210" y="1750" width="5" height="122" fill="#365f9f"/><text x="245" y="1753" font-family="Arial,Helvetica,sans-serif" font-size="44" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">“Not everything is as it seems.”</text><text x="245" y="1825" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="400" fill="#4a4f59" dominant-baseline="text-before-edge">A morning that changed the way I read a situation.</text><text x="210" y="1920" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#0d1d33" dominant-baseline="text-before-edge">ACADEMIC COLLECTION OF ENDEAVORS</text><text x="1288" y="1920" font-family="Arial,Helvetica,sans-serif" font-size="21" font-weight="700" fill="#365f9f" dominant-baseline="text-before-edge">A.C.E / 07</text></svg>