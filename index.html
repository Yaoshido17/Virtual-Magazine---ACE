<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>A.C.E — Revista interactiva</title>
<link rel="stylesheet" href="assets/style.css"></head><body>
<header><div><div class="brand">A.C.E</div><div class="subtitle">Academic Collection of Endeavors</div></div><div class="tools"><button id="contents" aria-expanded="false" aria-controls="drawer">▦ Páginas</button><button id="enlarge">＋ Ampliar</button><button id="fullscreen" aria-label="Activar pantalla completa">⛶</button></div></header>
<main class="reader" aria-label="Revista académica interactiva"><div class="book" id="book"></div><div class="mobile-page" id="mobile" role="button" tabindex="0" aria-label="Ampliar página"><img id="mobileImg" alt="Portada de la revista"></div></main>
<button class="nav prev" id="prev" aria-label="Página anterior">‹</button><button class="nav next" id="next" aria-label="Página siguiente">›</button>
<footer><div class="pagination"><button id="start" aria-label="Volver a la portada">↤</button><span id="counter" aria-live="polite"></span><button id="finish" aria-label="Ir a la última página">↦</button></div><div class="progress"><div id="progress"></div></div><p class="hint">Usa las flechas o desliza para pasar las hojas · Toca una página para ampliarla</p></footer>
<section class="drawer" id="drawer" aria-label="Todas las páginas" hidden><div class="drawer-head"><span>Explora la revista</span><button id="closeDrawer" aria-label="Cerrar páginas">✕</button></div><div class="thumbs" id="thumbs"></div></section>
<div class="zoom" id="zoom" role="dialog" aria-modal="true" aria-label="Página ampliada" hidden><div class="zoom-toolbar"><button id="zoomPrev" aria-label="Página anterior">‹</button><span id="zoomCounter"></span><button id="zoomNext" aria-label="Página siguiente">›</button><button id="closeZoom">✕ Cerrar</button></div><img id="zoomImg" alt="Página ampliada"></div>
<script src="assets/app.js" defer></script></body></html>
